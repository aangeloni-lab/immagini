<!DOCTYPE html>
<html lang="it">

<title>Lazio Quiz — Conosci la tua Storia</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,sans-serif;background:#0d1a35;color:#f4f8ff;min-height:100vh;-webkit-font-smoothing:antialiased}
:root{
  --sky:#87CEEB;--navy:#1a2f5e;--dark:#0d1a35;--light:#243870;
  --card:#1e3366;--border:#2d4a8a;--gold:#c9a84c;--goldL:#e8c96a;
  --dim:#6b7fa3;--green:#2ecc71;--red:#e74c3c;--white:#f4f8ff;
  --r:14px;--gap:12px;--pad:16px;
}
/* HERO */
.hero{position:relative;width:100%;height:clamp(180px,40vw,320px);overflow:hidden;background:linear-gradient(135deg,#0d1a35 0%,#1a2f5e 50%,#0d1a35 100%)}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(13,26,53,0.05) 0%,rgba(13,26,53,0.88) 100%)}
.hero-text{position:absolute;bottom:0;left:0;right:0;padding:clamp(14px,4vw,28px)}
.hero-text h1{font-size:clamp(22px,6vw,36px);font-weight:800;color:#fff;letter-spacing:0.5px;text-shadow:0 2px 8px rgba(0,0,0,0.8);line-height:1.2}
.hero-text p{font-size:clamp(13px,3vw,16px);color:var(--sky);margin-top:5px;text-shadow:0 1px 4px rgba(0,0,0,0.7)}
/* LAYOUT */
.container{max-width:620px;margin:0 auto;padding:clamp(14px,4vw,24px) clamp(12px,4vw,20px)}
/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:var(--pad)}
.label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px;font-weight:600}
/* BUTTONS */
.btn-p{background:var(--sky);color:#0d1a35;border:none;border-radius:10px;padding:clamp(11px,3vw,13px) 24px;font-size:clamp(14px,3.5vw,15px);font-weight:700;cursor:pointer;width:100%;transition:opacity .15s;font-family:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn-p:hover{opacity:.88}
.btn-p:active{opacity:.75;transform:scale(.98)}
.btn-p:disabled{opacity:.4;cursor:default}
.btn-s{background:transparent;color:var(--sky);border:1px solid var(--border);border-radius:10px;padding:clamp(10px,3vw,12px) 20px;font-size:clamp(13px,3.5vw,14px);font-weight:500;cursor:pointer;transition:background .15s;font-family:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn-s:hover{background:var(--light)}
.btn-s:active{background:var(--light);transform:scale(.98)}
.row{display:flex;gap:8px;margin-top:12px}
.row .btn-p,.row .btn-s{flex:1;min-width:0}
/* MODE TOGGLE */
.mode-row{display:flex;gap:8px;margin-bottom:14px}
.mbtn{flex:1;padding:clamp(10px,3vw,12px) 0;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer;font-size:clamp(13px,3.5vw,14px);font-weight:500;transition:all .15s;font-family:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.mbtn.ms{border-color:var(--sky);background:rgba(135,206,235,.12);color:var(--sky);font-weight:700}
.mbtn.mm{border-color:var(--goldL);background:rgba(201,168,76,.12);color:var(--goldL);font-weight:700}
/* PLAYERS */
.pl-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.add-row{display:flex;gap:8px;margin-top:8px}
.add-row input{flex:1;min-width:0;background:var(--light);border:1px solid var(--border);border-radius:8px;padding:clamp(8px,2.5vw,10px) 12px;color:var(--white);font-size:clamp(13px,3.5vw,14px);outline:none;font-family:inherit;-webkit-appearance:none}
.add-row input::placeholder{color:var(--dim)}
.add-btn{background:var(--sky);color:#0d1a35;border:none;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:16px;flex-shrink:0;touch-action:manipulation}
.rm{background:transparent;border:none;color:var(--dim);cursor:pointer;font-size:22px;padding:4px 6px;line-height:1;touch-action:manipulation;flex-shrink:0}
/* PROGRESS */
.prog-wrap{height:5px;background:var(--light);border-radius:5px}
.prog-bar{height:100%;border-radius:5px;transition:width .4s}
/* QUIZ HEADER */
.qh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{background:transparent;border:none;color:var(--dim);cursor:pointer;font-size:24px;padding:4px;line-height:1;touch-action:manipulation;flex-shrink:0}
.qmeta{flex:1;min-width:0}
.qmr{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:12px;color:var(--dim);gap:6px}
.qnum{font-size:12px;color:var(--dim);min-width:32px;text-align:right;flex-shrink:0}
/* QUESTION */
.qcard{border-left:3px solid var(--sky);margin-bottom:12px}
.qcard p{font-size:clamp(14px,3.8vw,16px);line-height:1.6}
/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.opt{display:flex;align-items:center;gap:10px;padding:clamp(11px,3vw,13px) 14px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--white);cursor:pointer;text-align:left;font-size:clamp(13px,3.5vw,14px);line-height:1.4;transition:all .15s;font-family:inherit;width:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--sky);background:rgba(135,206,235,.08)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt.ok{background:rgba(46,204,113,.2);border-color:#2ecc71}
.opt.no{background:rgba(231,76,60,.2);border-color:#e74c3c}
.oc{width:28px;height:28px;border-radius:50%;background:var(--light);color:var(--sky);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:700}
.opt.ok .oc{background:#2ecc71;color:#fff}
.opt.no .oc{background:#e74c3c;color:#fff}
/* FEEDBACK */
.fb{text-align:center;font-size:clamp(12px,3.5vw,14px);font-weight:600;margin-bottom:10px;padding:8px 12px;border-radius:8px;line-height:1.4}
.fb.ok{color:var(--green);background:rgba(46,204,113,.1)}
.fb.no{color:var(--red);background:rgba(231,76,60,.1)}
/* PASS SCREEN */
.pass-sc{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px;text-align:center;padding:20px}
.sbadge{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 28px}
/* RESULT */
.rh{text-align:center;margin-bottom:14px}
.rpts{font-size:clamp(36px,10vw,48px);font-weight:800;color:var(--goldL)}
.rsub{font-size:13px;color:var(--dim);margin-top:4px}
.ri{display:flex;gap:10px;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--border)}
.ri:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.cc{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;font-size:11px}
.cc.ok{background:rgba(46,204,113,.2);border:1px solid #2ecc71;color:#2ecc71}
.cc.no{background:rgba(231,76,60,.2);border:1px solid #e74c3c;color:#e74c3c}
.ca{font-size:12px;color:var(--green);margin-top:3px}
/* PODIUM */
.wcard{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.4);border-radius:14px;padding:20px;text-align:center;margin-bottom:14px}
.wname{font-size:clamp(20px,5vw,24px);font-weight:700;color:var(--goldL);margin-top:8px}
.wpts{font-size:clamp(34px,9vw,42px);font-weight:800;color:#fff}
.tcard{background:rgba(135,206,235,.1);border:1px solid rgba(135,206,235,.3);border-radius:14px;padding:20px;text-align:center;margin-bottom:14px}
.rrank{display:flex;align-items:center;gap:10px;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--border)}
.rrank:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.med{font-size:20px;min-width:26px;text-align:center;flex-shrink:0}
.rbw{height:5px;width:clamp(50px,15vw,90px);background:var(--light);border-radius:5px;flex-shrink:0}
.rb{height:100%;border-radius:5px}
/* BADGE CATEGORIA */
.cat-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(135,206,235,.15);color:var(--sky);border:1px solid rgba(135,206,235,.3);margin-bottom:6px;letter-spacing:0.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* SCROLLBAR */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--dark)}
::-webkit-scrollbar-thumb{background:var(--light);border-radius:4px}
</style>
</head>

const CATS = Object.keys(ALL_Q);

// ── Rotazione ciclica garantita ──────────────────────────────────────────
// Per ogni categoria manteniamo un indice di "prossima domanda da usare"
// Le domande di ogni categoria vengono mescolate una volta sola all'inizio
// e poi scorse in ordine. Quando una categoria finisce, viene rimescolata.

let catQueues = {}; // { categoria: [indici mescolati] }
let catPos = {};    // { categoria: prossimo indice da usare }

function initQueues() {
  CATS.forEach(cat => {
    catQueues[cat] = shuffleIndices(ALL_Q[cat].length);
    catPos[cat] = 0;
  });
}

function shuffleIndices(n) {
  const a = Array.from({length: n}, (_, i) => i);
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function nextFromCat(cat) {
  if (catPos[cat] >= catQueues[cat].length) {
    catQueues[cat] = shuffleIndices(ALL_Q[cat].length);
    catPos[cat] = 0;
  }
  const idx = catQueues[cat][catPos[cat]++];
  return ALL_Q[cat][idx];
}

function getMixed(n) {
  // Distribuisce n domande equamente a rotazione tra tutte le categorie
  const result = [];
  let ci = 0;
  for (let i = 0; i < n; i++) {
    result.push({ ...nextFromCat(CATS[ci % CATS.length]), _cat: CATS[ci % CATS.length] });
    ci++;
  }
  // Mescola l'ordine finale per non avere blocchi per categoria
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

initQueues();

// ── Helpers UI ───────────────────────────────────────────────────────────
function av(name, color, size=32) {
  const ini = (name||'?').split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
  return `<div class="av" style="width:${size}px;height:${size}px;border:2px solid ${color};background:${color}22;font-size:${Math.floor(size*.38)}px;color:${color}">${ini}</div>`;
}

// ── Stato ────────────────────────────────────────────────────────────────
let S = {
  screen:'home', mode:'solo',
  players:[], playerInput:'',
  questions:[], qIdx:0, selected:null,
  score:0, answers:[],
  currentPlayer:0, passScreen:false,
};

const app = document.getElementById('app');

function render() {
  if (S.screen==='home') renderHome();
  else if (S.screen==='quiz' && S.passScreen) renderPass();
  else if (S.screen==='quiz') renderQuiz();
  else if (S.screen==='result') renderResult();
}

// ── HOME ─────────────────────────────────────────────────────────────────
function renderHome() {
  const valid = S.players.filter(p=>p.name.trim());
  app.innerHTML = `
  <div class="mode-row">
    <button class="mbtn ${S.mode==='solo'?'ms':''}" onclick="setMode('solo')">&#128100; Solo</button>
    <button class="mbtn ${S.mode==='multi'?'mm':''}" onclick="setMode('multi')">&#128101; Multiplayer</button>
  </div>
  ${S.mode==='multi'?`
  <div class="card" style="margin-bottom:12px">
    <div class="label">Giocatori (${valid.length}/8)</div>
    ${S.players.map((p,i)=>`
    <div class="pl-row">
      ${av(p.name||'?', COLORS[i])}
      <span style="flex:1;font-size:14px">${p.name||`<span style="color:var(--dim)">Giocatore ${i+1}</span>`}</span>
      <button class="rm" onclick="removePlayer(${i})">×</button>
    </div>`).join('')}
    <div class="add-row">
      <input id="pi" type="text" placeholder="Nome giocatore..." value="${S.playerInput}"
        onkeydown="if(event.key==='Enter')addPlayer()" oninput="S.playerInput=this.value"/>
      <button class="add-btn" onclick="addPlayer()">+</button>
    </div>
  </div>`:''}
  <div class="card" style="margin-bottom:14px">
    <div class="label">Come funziona</div>
    <p style="color:var(--dim);font-size:13px;line-height:1.6">
      ${S.mode==='solo'
        ? `10 domande miste da tutte le 7 categorie · 10 punti per risposta corretta · Le 280 domande escono tutte a rotazione garantita`
        : `Ogni giocatore risponde a 10 domande a turno · Le domande sono distribuite tra tutte le 7 categorie · A fine partita classifica e vincitore`}
    </p>
  </div>
  <button class="btn-p" onclick="startGame()" ${S.mode==='multi'&&valid.length<2?'disabled':''}>
    ${S.mode==='solo'?'Inizia Quiz &#8594;':'Inizia Partita &#8594;'}
  </button>
  ${S.mode==='multi'&&valid.length<2?'<p style="color:var(--dim);font-size:12px;text-align:center;margin-top:6px">Aggiungi almeno 2 giocatori</p>':''}`;
}

// ── PASS ─────────────────────────────────────────────────────────────────
function renderPass() {
  const prev = S.players[S.currentPlayer-1];
  const curr = S.players[S.currentPlayer];
  app.innerHTML = `
  <div class="pass-sc">
    <div style="font-size:48px">&#128260;</div>
    <div style="font-size:18px;font-weight:600">Turno finito!</div>
    ${av(prev.name, COLORS[S.currentPlayer-1], 56)}
    <div style="color:var(--dim);font-size:14px">${prev.name} ha completato il suo turno</div>
    <div class="sbadge">
      <div style="font-size:13px;color:var(--dim)">Punteggio attuale</div>
      <div style="font-size:30px;font-weight:800;color:var(--goldL)">${prev.score}</div>
    </div>
    <div style="font-size:14px;color:var(--sky)">Passa il dispositivo a:</div>
    ${av(curr.name, COLORS[S.currentPlayer], 48)}
    <div style="font-size:16px;font-weight:700;color:${COLORS[S.currentPlayer]}">${curr.name}</div>
    <button class="btn-p" style="width:auto;padding:12px 32px;margin-top:8px" onclick="continuePass()">Sono pronto! &#8594;</button>
  </div>`;
}

// ── QUIZ ─────────────────────────────────────────────────────────────────
function renderQuiz() {
  const q = S.questions[S.qIdx];
  if (!q) return;
  const labels = ['A','B','C','D'];
  const turnSize = S.mode==='multi' ? MULTI_Q : SOLO_Q;
  const playerStart = S.mode==='multi' ? S.currentPlayer*turnSize : 0;
  const turnQ = S.qIdx - playerStart + 1;
  const cp = S.mode==='multi' ? S.players[S.currentPlayer] : null;
  const barColor = S.mode==='multi' ? COLORS[S.currentPlayer] : 'var(--sky)';
  const pct = ((turnQ-1)/turnSize)*100;
  const soloScore = S.answers.filter(a=>a.ok).length*PTS;

  app.innerHTML = `
  <div class="qh">
    <button class="back" onclick="goHome()">&#8592;</button>
    <div class="qmeta">
      <div class="qmr">
        <span style="color:var(--dim);font-size:12px">
          ${q._cat ? `<span class="cat-badge">${q._cat}</span>` : ''}
        </span>
        ${cp
          ? `<div style="display:flex;align-items:center;gap:6px">${av(cp.name,COLORS[S.currentPlayer],20)}<span style="font-size:12px;color:${COLORS[S.currentPlayer]};font-weight:600">${cp.name}</span></div>`
          : `<span style="color:var(--goldL);font-size:12px">${soloScore} pts</span>`}
      </div>
      <div class="prog-wrap"><div class="prog-bar" style="width:${pct}%;background:${barColor}"></div></div>
    </div>
    <span class="qnum">${turnQ}/${turnSize}</span>
  </div>
  <div class="card qcard"><p>${q.q}</p></div>
  <div class="opts">
    ${q.opts.map((opt,i)=>{
      let cls='opt', circ=labels[i];
      if (S.selected!==null) {
        if (i===q.ans) { cls+=' ok'; circ='&#10003;'; }
        else if (i===S.selected && i!==q.ans) { cls+=' no'; circ='&#10007;'; }
      }
      const disabled = S.selected!==null ? 'disabled' : '';
      return `<button class="${cls}" onclick="answer(${i})" ${disabled}><span class="oc">${circ}</span><span>${opt}</span></button>`;
    }).join('')}
  </div>
  ${S.selected!==null ? `
  <div class="fb ${S.answers[S.answers.length-1]?.ok?'ok':'no'}">
    ${S.answers[S.answers.length-1]?.ok ? `+${PTS} punti! &#10003;` : `Risposta errata &#10007; — Corretta: <strong>${q.opts[q.ans]}</strong>`}
  </div>
  <button class="btn-p" onclick="nextQ()">
    ${S.mode==='multi' && turnQ>=turnSize ? 'Fine turno &#8594;' : 'Prossima domanda &#8594;'}
  </button>` : ''}`;
}

// ── RESULT ───────────────────────────────────────────────────────────────
function renderResult() {
  if (S.mode==='solo') {
    const correct = S.answers.filter(a=>a.ok).length;
    const pts = correct*PTS;
    const pct = Math.round((correct/S.questions.length)*100);
    const grade = pct>=80?"Laziale doc! 🏆":pct>=50?"Buona partita! ⚽":"Studia di più! 📚";
    app.innerHTML = `
    <div class="rh">
      <div style="font-size:22px;font-weight:700;margin-bottom:6px">${grade}</div>
      <div class="rpts">${pts}</div>
      <div class="rsub">${correct}/${SOLO_Q} corrette · ${pct}%</div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div class="label">Riepilogo risposte</div>
      ${S.answers.map((a,i)=>`
      <div class="ri">
        <div class="cc ${a.ok?'ok':'no'}">${a.ok?'✓':'✗'}</div>
        <div>
          <div style="font-size:13px;line-height:1.4">${S.questions[i].q}</div>
          <div style="font-size:10px;color:var(--sky);margin-top:2px">${S.questions[i]._cat||''}</div>
          ${!a.ok?`<div class="ca">Risposta: ${a.opts[a.correct]}</div>`:''}
        </div>
      </div>`).join('')}
    </div>
    <div class="row">
      <button class="btn-s" onclick="goHome()">&#127968; Home</button>
      <button class="btn-p" onclick="startGame()">&#8635; Rigioca</button>
    </div>`;
  } else {
    const ranked = [...S.players].sort((a,b)=>b.score-a.score);
    const top = ranked[0].score;
    const tied = ranked.filter(p=>p.score===top);
    app.innerHTML = `
    <div class="rh" style="margin-bottom:14px">
      <div style="font-size:22px;font-weight:700;color:var(--goldL)">Partita terminata!</div>
      <div style="font-size:14px;color:var(--dim);margin-top:4px">${tied.length>1?'Pareggio!':'Il vincitore è...'}</div>
    </div>
    ${tied.length>1 ? `
    <div class="tcard">
      <div style="font-size:36px;margin-bottom:8px">🤝</div>
      <div style="font-size:20px;font-weight:700;color:var(--sky);margin-bottom:12px">Pareggio!</div>
      <div style="display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-bottom:10px">
        ${tied.map(p=>{const oi=S.players.findIndex(pl=>pl.name===p.name);return`<div style="display:flex;flex-direction:column;align-items:center;gap:6px">${av(p.name,COLORS[oi],48)}<div style="font-size:14px;font-weight:700;color:${COLORS[oi]}">${p.name}</div></div>`;}).join('')}
      </div>
      <div style="font-size:36px;font-weight:800;color:#fff">${top}</div>
      <div style="font-size:13px;color:var(--dim)">punti a testa</div>
    </div>` : `
    <div class="wcard">
      ${av(ranked[0].name, COLORS[S.players.findIndex(p=>p.name===ranked[0].name)], 64)}
      <div class="wname">${ranked[0].name}</div>
      <div class="wpts">${ranked[0].score}</div>
      <div style="font-size:13px;color:var(--dim)">punti</div>
      <div style="font-size:24px;margin-top:4px">🏆</div>
    </div>`}
    <div class="card" style="margin-bottom:14px">
      <div class="label">Classifica finale</div>
      ${ranked.map((p,i)=>{
        const oi = S.players.findIndex(pl=>pl.name===p.name);
        const medal = i===0?"🥇":i===1?"🥈":i===2?"🥉":`<span style="color:var(--dim);font-size:13px">#${i+1}</span>`;
        const bw = ranked[0].score>0 ? Math.round((p.score/ranked[0].score)*100) : 0;
        return `<div class="rrank">
          <div class="med">${medal}</div>
          ${av(p.name,COLORS[oi],36)}
          <div style="flex:1">
            <div style="font-size:15px;font-weight:${i===0?700:400};color:${i===0?'var(--goldL)':'var(--white)'}">${p.name}</div>
            <div style="font-size:12px;color:var(--dim)">${p.score} punti</div>
          </div>
          <div class="rbw"><div class="rb" style="width:${bw}%;background:${COLORS[oi]}"></div></div>
        </div>`;
      }).join('')}
    </div>
    <div class="row">
      <button class="btn-s" onclick="goHome()">&#127968; Home</button>
      <button class="btn-p" onclick="startGame()">&#8635; Rivincita</button>
    </div>`;
  }
}

// ── Actions ──────────────────────────────────────────────────────────────
window.setMode = m => { S.mode=m; render(); };
window.removePlayer = i => { S.players.splice(i,1); render(); };
window.addPlayer = () => {
  const v = S.playerInput.trim();
  if (v && S.players.filter(p=>p.name.trim()).length < 8) {
    S.players.push({name:v, score:0});
    S.playerInput = '';
    render();
    setTimeout(()=>{ const el=document.getElementById('pi'); if(el) el.focus(); },50);
  }
};
window.goHome = () => { S.screen='home'; render(); };
window.continuePass = () => { S.passScreen=false; render(); };

window.startGame = () => {
  const valid = S.players.filter(p=>p.name.trim());
  const n = S.mode==='multi' ? MULTI_Q*valid.length : SOLO_Q;
  S.questions = getMixed(n);
  S.qIdx=0; S.selected=null; S.score=0; S.answers=[];
  S.currentPlayer=0; S.passScreen=false;
  if (S.mode==='multi') S.players = valid.map(p=>({...p, score:0}));
  S.screen='quiz';
  render();
};

window.answer = idx => {
  if (S.selected!==null) return;
  S.selected = idx;
  const q = S.questions[S.qIdx];
  const ok = idx===q.ans;
  S.answers.push({ok, correct:q.ans, selected:idx, opts:q.opts, q:q.q});
  if (ok) S.score += PTS;
  render();
};

window.nextQ = () => {
  const turnSize = S.mode==='multi' ? MULTI_Q : SOLO_Q;
  const nextIdx = S.qIdx+1;
  if (S.mode==='solo') {
    if (nextIdx >= S.questions.length) { S.screen='result'; }
    else { S.qIdx=nextIdx; S.selected=null; }
  } else {
    const playerEnd = (S.currentPlayer+1)*turnSize;
    if (nextIdx >= playerEnd) {
      const turnStart = S.currentPlayer*turnSize;
      const turnPts = S.answers.slice(turnStart, turnStart+turnSize).filter(a=>a.ok).length*PTS;
      S.players[S.currentPlayer].score += turnPts;
      const nextPlayer = S.currentPlayer+1;
      if (nextPlayer >= S.players.length) { S.screen='result'; }
      else { S.currentPlayer=nextPlayer; S.passScreen=true; S.qIdx=nextIdx; S.selected=null; }
    } else {
      S.qIdx=nextIdx; S.selected=null;
    }
  }
  render();
};

render();
</script>
